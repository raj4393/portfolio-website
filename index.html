<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CGPA Calculator</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b);
}

.box{
    width:420px;
    padding:30px;
    border-radius:20px;
    background:rgba(30,41,59,0.9);
    backdrop-filter:blur(10px);
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

h2{
    text-align:center;
    color:white;
    margin-bottom:25px;
    font-size:30px;
}

.input-group{
    margin-bottom:15px;
}

input{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:12px;
    background:#0f172a;
    color:white;
    font-size:16px;
    transition:0.3s;
}

input:focus{
    border:2px solid #38bdf8;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    background:#0ea5e9;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#0284c7;
    transform:translateY(-2px);
}

.result{
    margin-top:25px;
    text-align:center;
    padding:15px;
    border-radius:12px;
    background:#0f172a;
}

#cgpa{
    color:#22c55e;
    font-size:26px;
    font-weight:600;
}

</style>
</head>

<body>

<div class="box">

<h2>🎓 CGPA Calculator</h2>

<div class="input-group">
<input type="number" id="s1" placeholder="Semester 1 GPA">
</div>

<div class="input-group">
<input type="number" id="s2" placeholder="Semester 2 GPA">
</div>

<div class="input-group">
<input type="number" id="s3" placeholder="Semester 3 GPA">
</div>

<div class="input-group">
<input type="number" id="s4" placeholder="Semester 4 GPA">
</div>

<button onclick="calculateCGPA()">
Calculate CGPA
</button>

<div class="result">
<h3 id="cgpa">Enter GPA Values</h3>
</div>

</div>

<script>

function calculateCGPA(){

let s1 = parseFloat(document.getElementById("s1").value) || 0;
let s2 = parseFloat(document.getElementById("s2").value) || 0;
let s3 = parseFloat(document.getElementById("s3").value) || 0;
let s4 = parseFloat(document.getElementById("s4").value) || 0;

let cgpa = (s1 + s2 + s3 + s4) / 4;

document.getElementById("cgpa").innerHTML =
"CGPA : " + cgpa.toFixed(2);

}

</script>

</body>
</html>
